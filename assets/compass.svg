<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">A compass turning in the earth's field, and the two axes it produces</title>
  <desc id="d">A magnetised needle turns through a full circle above a QMC5883L; below, the X and Y field components trace the quadrature pair whose arctangent is the heading.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2238"/>
      <stop offset="1" stop-color="#102f34"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lbl  { font-family: ui-monospace, monospace; font-size: 13px; fill: #9edbc4; letter-spacing: 1px; }
      .blk  { font-family: ui-monospace, monospace; font-size: 15px; fill: #e8f5ef; letter-spacing: 1.5px; }
      .sml  { font-family: ui-monospace, monospace; font-size: 11px; fill: #9edbc4; letter-spacing: 1px; }
      .wire { stroke: #51c99c; stroke-width: 2.4; fill: none; opacity: .78; }
      .box  { fill: none; stroke: #70e1b2; stroke-width: 2.2; opacity: .88; }
      .grid { stroke: #234a52; stroke-width: 1; opacity: .55; }
      .amb  { stroke: #f2bd68; stroke-width: 2.2; fill: none; }
      .sp   { stroke: #f2bd68; stroke-width: 2; stroke-dasharray: 7 7; opacity: .8; }
      .trace { fill: none; stroke: #70e1b2; stroke-width: 3.2;
               stroke-dasharray: 1000; stroke-dashoffset: 1000;
               animation: draw 6s linear infinite; }
      .trace2{ fill: none; stroke: #f2bd68; stroke-width: 2.6; opacity: .9;
               stroke-dasharray: 1000; stroke-dashoffset: 1000;
               animation: draw 6s linear infinite; }
      .noisy { fill: none; stroke: #5f8fb0; stroke-width: 1.3; opacity: .45; }
      .truth { fill: none; stroke: #f2bd68; stroke-width: 2; stroke-dasharray: 7 7; opacity: .8; }
      .drift { fill: none; stroke: #d97a6c; stroke-width: 2.2; opacity: .72; }
      .band  { fill: #70e1b2; opacity: .13; }
      .pcl   { fill: none; stroke: #70e1b2; stroke-width: 1; opacity: .22; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 72% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .trace, .trace2 { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="900" height="400" rx="26" fill="url(#bg)"/>

  <g transform="translate(190,116)">
    <circle r="74" class="box"/>
    <g class="grid">
      <line x1="0" y1="-74" x2="0" y2="74"/><line x1="-74" y1="0" x2="74" y2="0"/>
    </g>
    <text class="sml" x="0" y="-56" text-anchor="middle">N</text>
    <g>
      <path d="M0 -50L11 0L0 50L-11 0Z" fill="#f2bd68" opacity=".9"/>
      <path d="M0 0L11 0L0 50L-11 0Z" fill="#51c99c" opacity=".9"/>
      <animateTransform attributeName="transform" type="rotate"
